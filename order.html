<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка – PowerShop</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">

  <header class="py-5 header-bg"></header>

  <nav class="navbar navbar-expand-lg navbar-dark bg-black">
    <div class="container">
      <a class="navbar-brand text-danger fw-bold" href="index.html">PowerShop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
          <li class="nav-item"><a class="nav-link active" href="order.html">Заявка</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-danger text-white">
            <h1 class="h4 mb-0">Форма заявки</h1>
          </div>
          <div class="card-body">
            <div class="alert alert-info" role="alert">
              Заполните форму. Поля со звёздочкой являются обязательными.
            </div>
            <form>
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label for="order-name" class="form-label">Имя *</label>
                  <input id="order-name" name="name" type="text" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-email" class="form-label">E-mail *</label>
                  <input id="order-email" name="email" type="email" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-phone" class="form-label">Телефон</label>
                  <div class="input-group">
                    <span class="input-group-text">+7</span>
                    <input id="order-phone" name="phone" type="tel" class="form-control" placeholder="900 000-00-00">
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-product" class="form-label">Товар</label>
                  <select id="order-product" name="product" class="form-select">
                    <option selected>Выберите товар</option>
                    <option value="belt">Пояс для пауэрлифтинга</option>
                    <option value="wraps">Кистевые бинты</option>
                    <option value="knee">Наколенники</option>
                  </select>
                </div>
                <div class="col-12">
                  <label for="order-comment" class="form-label">Комментарий</label>
                  <textarea id="order-comment" name="comment" class="form-control" rows="4" placeholder="Укажите размер или другие пожелания"></textarea>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input id="order-agree" class="form-check-input" type="checkbox" required>
                    <label class="form-check-label" for="order-agree">
                      Я согласен на обработку данных *
                    </label>
                  </div>
                </div>
                <div class="col-12 d-flex gap-2">
                  <button class="btn btn-danger" type="submit">Отправить заявку</button>
                  <button class="btn btn-outline-secondary" type="reset">Очистить</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">
            Заявка успешно отправлена! Мы свяжемся с вами.
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Закрыть"></button>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 PowerShop. Учебный проект.</p>
    </div>
  </footer>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();
      const toastEl = document.getElementById('liveToast');
      const toast = new bootstrap.Toast(toastEl);
      toast.show();
      this.reset();
    });
  </script>
</body>
</html>
